// Step 9 / Track B — authoritative proxy firewall protocol
//
// Every mutating command carries the daemon-issued (session_id, epoch) token it
// targets. The root daemon validates that token and performs validation plus
// kernel mutation under one serialized critical section. Stale commands are
// rejected before any iptables mutation.

syntax = "proto3";

package vpnhotspot.proxy;

option java_package = "be.mygod.vpnhotspot.proxy.proto";
option java_outer_classname = "ProxyFirewallProto";
option optimize_for = LITE_RUNTIME;

// ---------------------------------------------------------------------------
// Runtime configuration
// ---------------------------------------------------------------------------

message ProxyFirewallConfig {
  repeated ProxyDownstream downstreams = 1;
  uint32 tcp_port = 2;
  uint32 udp_port_range_start = 3;
  uint32 udp_port_range_end = 4;
  repeated ProxyClient allowed_clients = 5;

  // Monotonic within one runtime. Replace is accepted only when this is newer
  // than the currently applied configuration generation.
  uint64 generation = 6;

  // Start and Sanitize must be deny-first. Empty allowed_clients is never a
  // deny signal.
  bool deny_all_ipv4 = 7;
  bool deny_all_ipv6 = 8;

  // Deliberately absent from active rule generation until Phase 0.5 evidence.
  optional VerifiedUdpReturnPolicy udp_return_policy = 9;
}

message ProxyDownstream {
  string interface_name = 1;
  repeated bytes ipv4_addresses = 2;
}

message ProxyClient {
  bytes mac = 1;
  repeated bytes ipv4 = 2;
}

message VerifiedUdpReturnPolicy {
  string evidence_summary = 1;
  bool allow_related = 2;
}

// ---------------------------------------------------------------------------
// Authoritative daemon identity and commands
// ---------------------------------------------------------------------------

message DaemonIdentity {
  // Crash-persistent boot counter. It changes on every daemon process start.
  uint64 session_id = 1;

  // Sanitation epoch within the current daemon session.
  uint64 epoch = 2;

  // Transport/boot generation. For Track B this is the boot session counter;
  // per-runtime replacement ordering remains ProxyFirewallConfig.generation.
  uint64 generation = 3;
}

message ProxyFirewallCommand {
  oneof kind {
    SanitizeRequest sanitize = 1;
    StartRequest start = 2;
    ReplaceRequest replace = 3;
    DenyRequest deny = 4;
    StopRequest stop = 5;
  }
}

message SanitizeRequest {
  string reason = 1;

  // Desired downstream/listener containment. The daemon installs this explicit
  // deny-only configuration before clearing its ledger and advancing epoch.
  ProxyFirewallConfig containment_config = 2;
}

message StartRequest {
  ProxyFirewallConfig config = 1;
  uint64 expected_session_id = 2;
  uint64 expected_epoch = 3;
}

message ReplaceRequest {
  uint64 handle_id = 1;
  ProxyFirewallConfig config = 2;
  uint64 expected_session_id = 3;
  uint64 expected_epoch = 4;
}

message DenyRequest {
  uint64 handle_id = 1;
  uint64 expected_session_id = 2;
  uint64 expected_epoch = 3;
}

message StopRequest {
  uint64 handle_id = 1;
  uint64 expected_session_id = 2;
  uint64 expected_epoch = 3;
}

message ProxyFirewallAck {
  enum Status {
    OK = 0;
    STALE_SESSION = 1;
    STALE_EPOCH = 2;
    INVALID = 3;
    IO_ERROR = 4;
  }

  Status status = 1;

  // Always present and authoritative, including stale/error acknowledgements.
  DaemonIdentity identity = 2;

  // Newly issued runtime ID for Start; zero for other commands and failures.
  uint64 handle_id = 3;
  string detail = 4;
}
