name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          # Gradle snapshots are submitted by dependency-submission.yml on push.
          # A PR run can start before that push workflow finishes, so wait rather
          # than treating the temporary snapshot warning as a policy failure.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
