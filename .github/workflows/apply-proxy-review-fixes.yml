name: Apply proxy review fixes

on:
  push:
    branches:
      - agent/proxy-only-design

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/proxy-only-design
      - name: Apply reviewed invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          controller = "mobile/src/main/java/be/mygod/vpnhotspot/proxy/ProxyOnlyController.kt"
          replace(
              controller,
              '''            firewallGeneration = AtomicLong(result.epoch)
              sanitizedDaemonGeneration = capturedDaemonGeneration
              sanitizedSessionId = result.sessionId
              sanitizedEpoch = result.epoch
          ''',
              '''            if (result.daemonGeneration != capturedDaemonGeneration) {
                  val mismatch = "sanitation acknowledgement generation ${result.daemonGeneration} " +
                      "does not match observed daemon generation $capturedDaemonGeneration"
                  withContext(NonCancellable) {
                      cleanupApplied("sanitation identity mismatch", daemonAvailable = false)
                  }
                  mergeDebt(
                      CleanupDebt(
                          listenerClosePending = false, serviceHandlePending = null,
                          firewallHandlePending = null, firewallDenyPending = false,
                          firewallStopPending = false, daemonCleanPending = true,
                          featureStopPending = false, serviceWasActivated = serviceActivated,
                          failures = listOf(
                              CleanupFailure("startup_sanitation_generation", RuntimeException(mismatch))
                          ),
                          generation = nextDebtGeneration++, attempt = 0,
                      )
                  )
                  val state = cleanupDebt?.let(::debtState)
                      ?: ProxyOnlyState.FailClosed(
                          FailClosedReason.StartupSanitationFailed(mismatch)
                      )
                  enterWaitingIfActive(state)
                  publishSafely(state)
                  cleanupDebt?.let(::scheduleDebtRetry)
                  return
              }

              firewallGeneration = AtomicLong(result.epoch)
              sanitizedDaemonGeneration = result.daemonGeneration
              sanitizedSessionId = result.sessionId
              sanitizedEpoch = result.epoch
          ''',
          )
          replace(
              controller,
              '''                if (currentGeneration == capturedDaemonGeneration) {
                      daemonCleanPending = false
                      newFirewallGenerationEpoch = result.epoch
                      newSanitizedEpoch = result.epoch
                      newSanitizedSessionId = result.sessionId
                      newSanitizedDaemonGen = capturedDaemonGeneration
                  } else {
                      // Generation changed while IPC was in flight. The acknowledgement
                      // belongs to the old generation and must not be stored as sanitation
                      // for the new one. Retain daemonCleanPending; reconcile will
                      // re-sanitize the new daemon via the sanitation gate.
                      failures += CleanupFailure(
                          "daemon_clean_race",
                          RuntimeException(
                              "daemon generation changed from $capturedDaemonGeneration to " +
                                  "$currentGeneration during cleanOrDenyBeforeRestart; " +
                                  "acknowledgement discarded"
                          )
                      )
                  }
              ''',
              '''                if (currentGeneration == capturedDaemonGeneration &&
                      result.daemonGeneration == capturedDaemonGeneration) {
                      daemonCleanPending = false
                      newFirewallGenerationEpoch = result.epoch
                      newSanitizedEpoch = result.epoch
                      newSanitizedSessionId = result.sessionId
                      newSanitizedDaemonGen = result.daemonGeneration
                  } else {
                      // Both the observed generation and the acknowledgement-issued
                      // generation must identify the same daemon. Retain sanitation debt
                      // whenever either clock changed or disagrees.
                      failures += CleanupFailure(
                          "daemon_clean_race",
                          RuntimeException(
                              "daemon generation mismatch during cleanOrDenyBeforeRestart: " +
                                  "captured=$capturedDaemonGeneration current=$currentGeneration " +
                                  "ack=${result.daemonGeneration}; acknowledgement discarded"
                          )
                      )
                  }
              ''',
          )

          replace(
              "mobile/src/test/java/be/mygod/vpnhotspot/proxy/CleanupGenerationMatrixTest.kt",
              "SanitationResult(sessionId = 9, epoch = 7)",
              "SanitationResult(sessionId = 9, epoch = 7, daemonGeneration = 11)",
          )

          rust_mod = "mobile/src/main/rust/vpnhotspotd/src/proxy_firewall/mod.rs"
          replace(
              rust_mod,
              '''    /// Called while the same outer state lock covers daemon-wide routing clean.
              /// Kernel cleanup has already completed when this is invoked.
              pub fn record_external_clean(&mut self) -> io::Result<()> {
                  self.ledger.clear();
                  self.session.bump_epoch()?;
                  Ok(())
              }
          ''',
              '''    /// Execute daemon-wide kernel cleanup while this proxy-firewall state is
              /// exclusively borrowed, then clear the applied ledger and advance the epoch.
              /// A failed cleanup returns without changing either ledger or identity.
              pub async fn record_external_clean<F, Fut>(&mut self, clean: F) -> io::Result<()>
              where
                  F: FnOnce() -> Fut,
                  Fut: Future<Output = io::Result<()>>,
              {
                  clean().await?;
                  self.ledger.clear();
                  self.session.bump_epoch()?;
                  Ok(())
              }
          ''',
          )
          replace(
              rust_mod,
              '''    if require_deny_first && (!config.deny_all_ipv4 || !config.deny_all_ipv6) {
                  return Err("operation requires explicit IPv4 and IPv6 deny-first configuration".to_owned());
              }
          ''',
              '''    if require_deny_first && (!config.deny_all_ipv4 || !config.deny_all_ipv6) {
                  return Err("operation requires explicit IPv4 and IPv6 deny-first configuration".to_owned());
              }
              if require_deny_first && !config.allowed_clients.is_empty() {
                  return Err("deny-first configuration must not contain allowed clients".to_owned());
              }
          ''',
          )
          replace(
              rust_mod,
              '''        fn deny<'a>(
                  &'a mut self,
                  _handle_id: u64,
                  _config: &'a ProxyFirewallConfig,
              ) -> KernelFuture<'a, ()> {
                  Box::pin(async move {
                      self.calls.push("deny");
                      Ok(())
                  })
              }
          ''',
              '''        fn deny<'a>(
                  &'a mut self,
                  _handle_id: u64,
                  config: &'a ProxyFirewallConfig,
              ) -> KernelFuture<'a, ()> {
                  Box::pin(async move {
                      assert!(config.deny_all_ipv4);
                      assert!(config.deny_all_ipv6);
                      assert!(config.allowed_clients.is_empty());
                      self.calls.push("deny");
                      Ok(())
                  })
              }
          ''',
          )
          marker = '''    #[test]
              fn session_id_never_repeats_for_one_store() {
          '''
          tests = '''    #[tokio::test]
              async fn start_rejects_clients_in_deny_first_config_without_kernel_change() {
                  let store = MemoryStore::default();
                  let mut firewall = ProxyFirewall::boot(&store, SpyKernel::default()).unwrap();
                  let identity = firewall.identity();
                  let mut invalid = config(1, false);
                  invalid.deny_all_ipv4 = true;
                  invalid.deny_all_ipv6 = true;
                  let ack = firewall
                      .handle(ProxyFirewallCommand {
                          kind: Some(proxy_firewall_command::Kind::Start(StartRequest {
                              config: Some(invalid),
                              expected_session_id: identity.session_id,
                              expected_epoch: identity.epoch,
                          })),
                      })
                      .await;
                  assert_eq!(status(&ack), proxy_firewall_ack::Status::Invalid);
                  assert!(firewall.kernel.calls.is_empty());
              }

              #[tokio::test]
              async fn second_start_is_rejected_without_second_kernel_mutation() {
                  let store = MemoryStore::default();
                  let mut firewall = ProxyFirewall::boot(&store, SpyKernel::default()).unwrap();
                  let identity = firewall.identity();
                  for expected in [proxy_firewall_ack::Status::Ok, proxy_firewall_ack::Status::Invalid] {
                      let ack = firewall
                          .handle(ProxyFirewallCommand {
                              kind: Some(proxy_firewall_command::Kind::Start(StartRequest {
                                  config: Some(config(1, true)),
                                  expected_session_id: identity.session_id,
                                  expected_epoch: identity.epoch,
                              })),
                          })
                          .await;
                      assert_eq!(status(&ack), expected);
                  }
                  assert_eq!(firewall.kernel.calls, vec!["start"]);
              }

              #[tokio::test]
              async fn deny_clears_clients_and_sets_both_deny_flags() {
                  let store = MemoryStore::default();
                  let mut firewall = ProxyFirewall::boot(&store, SpyKernel::default()).unwrap();
                  let identity = firewall.identity();
                  let start = firewall
                      .handle(ProxyFirewallCommand {
                          kind: Some(proxy_firewall_command::Kind::Start(StartRequest {
                              config: Some(config(1, true)),
                              expected_session_id: identity.session_id,
                              expected_epoch: identity.epoch,
                          })),
                      })
                      .await;
                  let handle = start.handle_id;
                  let replace = firewall
                      .handle(ProxyFirewallCommand {
                          kind: Some(proxy_firewall_command::Kind::Replace(ReplaceRequest {
                              handle_id: handle,
                              config: Some(config(2, false)),
                              expected_session_id: identity.session_id,
                              expected_epoch: identity.epoch,
                          })),
                      })
                      .await;
                  assert_eq!(status(&replace), proxy_firewall_ack::Status::Ok);
                  let deny = firewall
                      .handle(ProxyFirewallCommand {
                          kind: Some(proxy_firewall_command::Kind::Deny(DenyRequest {
                              handle_id: handle,
                              expected_session_id: identity.session_id,
                              expected_epoch: identity.epoch,
                          })),
                      })
                      .await;
                  assert_eq!(status(&deny), proxy_firewall_ack::Status::Ok);
                  assert_eq!(firewall.kernel.calls, vec!["start", "replace", "deny"]);
              }

              #[tokio::test]
              async fn stop_removes_handle_and_second_stop_is_rejected() {
                  let store = MemoryStore::default();
                  let mut firewall = ProxyFirewall::boot(&store, SpyKernel::default()).unwrap();
                  let identity = firewall.identity();
                  let start = firewall
                      .handle(ProxyFirewallCommand {
                          kind: Some(proxy_firewall_command::Kind::Start(StartRequest {
                              config: Some(config(1, true)),
                              expected_session_id: identity.session_id,
                              expected_epoch: identity.epoch,
                          })),
                      })
                      .await;
                  let request = StopRequest {
                      handle_id: start.handle_id,
                      expected_session_id: identity.session_id,
                      expected_epoch: identity.epoch,
                  };
                  let first = firewall
                      .handle(ProxyFirewallCommand {
                          kind: Some(proxy_firewall_command::Kind::Stop(request.clone())),
                      })
                      .await;
                  let second = firewall
                      .handle(ProxyFirewallCommand {
                          kind: Some(proxy_firewall_command::Kind::Stop(request)),
                      })
                      .await;
                  assert_eq!(status(&first), proxy_firewall_ack::Status::Ok);
                  assert_eq!(status(&second), proxy_firewall_ack::Status::Invalid);
                  assert_eq!(firewall.kernel.calls, vec!["start", "stop"]);
              }

              #[tokio::test]
              async fn failed_external_clean_preserves_epoch_and_runtime() {
                  let store = MemoryStore::default();
                  let mut firewall = ProxyFirewall::boot(&store, SpyKernel::default()).unwrap();
                  let identity = firewall.identity();
                  let start = firewall
                      .handle(ProxyFirewallCommand {
                          kind: Some(proxy_firewall_command::Kind::Start(StartRequest {
                              config: Some(config(1, true)),
                              expected_session_id: identity.session_id,
                              expected_epoch: identity.epoch,
                          })),
                      })
                      .await;
                  let before = firewall.identity();
                  let error = firewall
                      .record_external_clean(|| async { Err(io::Error::other("routing clean failed")) })
                      .await
                      .unwrap_err();
                  assert_eq!(error.kind(), io::ErrorKind::Other);
                  assert_eq!(firewall.identity(), before);
                  let stop = firewall
                      .handle(ProxyFirewallCommand {
                          kind: Some(proxy_firewall_command::Kind::Stop(StopRequest {
                              handle_id: start.handle_id,
                              expected_session_id: identity.session_id,
                              expected_epoch: identity.epoch,
                          })),
                      })
                      .await;
                  assert_eq!(status(&stop), proxy_firewall_ack::Status::Ok);
                  assert_eq!(firewall.kernel.calls, vec!["start", "stop"]);
              }

              #[tokio::test]
              async fn successful_external_clean_advances_epoch_and_clears_runtime() {
                  let store = MemoryStore::default();
                  let mut firewall = ProxyFirewall::boot(&store, SpyKernel::default()).unwrap();
                  let identity = firewall.identity();
                  let start = firewall
                      .handle(ProxyFirewallCommand {
                          kind: Some(proxy_firewall_command::Kind::Start(StartRequest {
                              config: Some(config(1, true)),
                              expected_session_id: identity.session_id,
                              expected_epoch: identity.epoch,
                          })),
                      })
                      .await;
                  firewall
                      .record_external_clean(|| async { Ok(()) })
                      .await
                      .unwrap();
                  assert_eq!(firewall.identity().epoch, identity.epoch + 1);
                  let stale = firewall
                      .handle(ProxyFirewallCommand {
                          kind: Some(proxy_firewall_command::Kind::Stop(StopRequest {
                              handle_id: start.handle_id,
                              expected_session_id: identity.session_id,
                              expected_epoch: identity.epoch,
                          })),
                      })
                      .await;
                  assert_eq!(status(&stale), proxy_firewall_ack::Status::StaleEpoch);
                  assert_eq!(firewall.kernel.calls, vec!["start"]);
              }

          ''' + marker
          replace(rust_mod, marker, tests)

          replace(
              "mobile/src/main/rust/vpnhotspotd/src/control.rs",
              '''            let mut proxy = state.proxy_firewall.lock().await;
              let mut handle = netlink::RequestConnection::new()
                  .with_report_context("control.clean_routing.netlink")?;
              routing::clean(&mut handle, &command)
                  .await
                  .with_report_context("control.clean_routing")?;
              proxy
                  .record_external_clean()
                  .with_report_context("control.clean_routing.proxy_epoch")?;
          ''',
              '''            let mut proxy = state.proxy_firewall.lock().await;
              let mut handle = netlink::RequestConnection::new()
                  .with_report_context("control.clean_routing.netlink")?;
              proxy
                  .record_external_clean(|| async {
                      routing::clean(&mut handle, &command)
                          .await
                          .with_report_context("control.clean_routing")
                  })
                  .await
                  .with_report_context("control.clean_routing.proxy_epoch")?;
          ''',
          )

          session = "mobile/src/main/rust/vpnhotspotd/src/proxy_firewall/session.rs"
          replace(
              session,
              '''    pub fn path(&self) -> &Path {
                  &self.path
              }

              fn lock(&self) -> io::Result<FileLock> {
          ''',
              '''    pub fn path(&self) -> &Path {
                  &self.path
              }

              fn temporary_path(&self) -> io::Result<PathBuf> {
                  let file_name = self.path.file_name().ok_or_else(|| {
                      io::Error::new(io::ErrorKind::InvalidInput, "session counter path has no file name")
                  })?;
                  let name = file_name.to_string_lossy();
                  Ok(self.path.with_file_name(format!(
                      "{name}.tmp-{}-{:?}",
                      std::process::id(),
                      std::thread::current().id(),
                  )))
              }

              fn cleanup_stale_temporaries(&self) -> io::Result<()> {
                  let Some(parent) = self.path.parent().filter(|path| !path.as_os_str().is_empty()) else {
                      return Ok(());
                  };
                  let Some(file_name) = self.path.file_name() else {
                      return Err(io::Error::new(
                          io::ErrorKind::InvalidInput,
                          "session counter path has no file name",
                      ));
                  };
                  let prefix = format!("{}.tmp-", file_name.to_string_lossy());
                  for entry in fs::read_dir(parent)? {
                      let entry = entry?;
                      if !entry.file_name().to_string_lossy().starts_with(&prefix) {
                          continue;
                      }
                      match fs::remove_file(entry.path()) {
                          Ok(()) => {}
                          Err(error) if error.kind() == io::ErrorKind::NotFound => {}
                          Err(error) => return Err(error),
                      }
                  }
                  Ok(())
              }

              fn lock(&self) -> io::Result<FileLock> {
          ''',
          )
          replace(
              session,
              '''        let _lock = self.lock()?;

              let current = match fs::read_to_string(&self.path) {
          ''',
              '''        let _lock = self.lock()?;
              self.cleanup_stale_temporaries()?;

              let current = match fs::read_to_string(&self.path) {
          ''',
          )
          replace(
              session,
              '''        let temporary = self.path.with_extension(format!(
                  "tmp-{}-{:?}",
                  std::process::id(),
                  std::thread::current().id(),
              ));
          ''',
              '''        let temporary = self.temporary_path()?;
          ''',
          )
          replace(
              session,
              '''    use std::sync::Arc;
              use std::time::{SystemTime, UNIX_EPOCH};
          ''',
              '''    use std::process::{Command, Stdio};
              use std::sync::Arc;
              use std::time::{SystemTime, UNIX_EPOCH};
          ''',
          )
          marker = '''    #[test]
              fn file_store_serializes_concurrent_boots() {
          '''
          insert = '''    #[test]
              fn file_store_removes_stale_temporary_files_under_lock() {
                  let (directory, store) = temporary_store("stale-temp");
                  fs::create_dir_all(&directory).unwrap();
                  let stale = store.path().with_file_name("counter.tmp-stale");
                  fs::write(&stale, "partial").unwrap();

                  assert_eq!(store.next_session_id().unwrap(), 1);
                  assert!(!stale.exists());

                  fs::remove_dir_all(directory).unwrap();
              }

              #[test]
              fn file_store_process_helper() {
                  let Some(path) = std::env::var_os("VPNHOTSPOTD_SESSION_STORE_HELPER") else {
                      return;
                  };
                  let value = FileSessionStore::new(path).next_session_id().unwrap();
                  println!("SESSION_ID={value}");
              }

              #[test]
              fn file_store_serializes_concurrent_processes() {
                  let (directory, store) = temporary_store("processes");
                  let executable = std::env::current_exe().unwrap();
                  let test_name = "proxy_firewall::session::tests::file_store_process_helper";
                  let mut children = Vec::new();
                  for _ in 0..8 {
                      children.push(
                          Command::new(&executable)
                              .args(["--exact", test_name, "--nocapture"])
                              .env("VPNHOTSPOTD_SESSION_STORE_HELPER", store.path())
                              .stdout(Stdio::piped())
                              .spawn()
                              .unwrap(),
                      );
                  }
                  let mut values = children
                      .into_iter()
                      .map(|child| {
                          let output = child.wait_with_output().unwrap();
                          assert!(output.status.success(), "{}", String::from_utf8_lossy(&output.stderr));
                          String::from_utf8_lossy(&output.stdout)
                              .lines()
                              .find_map(|line| line.strip_prefix("SESSION_ID="))
                              .unwrap()
                              .parse::<u64>()
                              .unwrap()
                      })
                      .collect::<Vec<_>>();
                  values.sort_unstable();

                  assert_eq!(values, (1..=8).collect::<Vec<_>>());
                  assert_eq!(fs::read_to_string(store.path()).unwrap().trim(), "8");

                  fs::remove_dir_all(directory).unwrap();
              }

          ''' + marker
          replace(session, marker, insert)
          PY
          git diff --check
          git status --short
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src
          git commit -m "Apply remaining proxy review fixes"
          git push origin HEAD:agent/proxy-only-design
