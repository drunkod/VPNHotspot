name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true
          ref: agent/proxy-only-design

      - name: Apply Track C implementation
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          mkdir -p mobile/build/reports
          if ! python3 .github/scripts/apply_track_c.py > mobile/build/reports/track-c-patch.log 2>&1; then
            cat mobile/build/reports/track-c-patch.log
            exit 1
          fi
          cat mobile/build/reports/track-c-patch.log
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Track C cleanup supervisor"
          git push origin HEAD:agent/proxy-only-design

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Check Rust daemon
        working-directory: mobile/src/main/rust/vpnhotspotd
        run: cargo check --locked --all-targets

      - name: Test Rust daemon library
        working-directory: mobile/src/main/rust/vpnhotspotd
        run: cargo test --locked --lib

      - name: Run Rust daemon clippy
        working-directory: mobile/src/main/rust/vpnhotspotd
        run: |
          mkdir -p ../../../../build/reports
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ../../../../build/reports/clippy.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Run build and tests
        run: |
          mkdir -p mobile/build/reports
          ./gradlew assembleDebug check --no-daemon 2>&1 | tee mobile/build/reports/gradle.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust daemon dependencies
        working-directory: mobile/src/main/rust/vpnhotspotd
        run: cargo audit

      - name: Verify release R8 coroutine debug
        run: ./gradlew :mobile:verifyReleaseCoroutineDebugR8 --no-daemon

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: mobile/build/outputs/apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: mobile/build/reports
